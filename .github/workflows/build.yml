name: Build Code - OSS (Open VSX Enabled)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Added libkrb5-dev to fix the gssapi.h missing header error
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev dbus xvfb libgtk-3-0 libkrb5-dev
          
      - name: Inject Open VSX Registry
        run: |
          jq '.extensionsGallery = {
            "serviceUrl": "https://open-vsx.org/vscode/gallery",
            "itemUrl": "https://open-vsx.org/vscode/item",
            "resourceUrlTemplate": "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
            "extensionUrlTemplate": "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest"
          }' product.json > product.tmp.json
          
          mv product.tmp.json product.json

      - name: Install Node Dependencies
        # Optional: Adding --foreground-scripts helps surface native compilation errors more clearly
        run: npm ci --foreground-scripts

      - name: Build the Minified Binary
        run: npm run gulp -- vscode-linux-x64-min

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Code-OSS-Linux-x64
          path: ../VSCode-linux-x64
